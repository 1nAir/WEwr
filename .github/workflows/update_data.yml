name: Update Wealthrate Data & Build Site

on:
  workflow_dispatch:

concurrency:
  group: warera-api-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 13

    steps:
    - name: Checkout repository code (main)
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1

    - name: Checkout data branch
      uses: actions/checkout@v4
      with:
        ref: data
        path: data_store
        fetch-depth: 1

    - name: Copy existing data for analysis
      run: |
        cp -f data_store/*.json . 2>/dev/null || true
        cp -rf data_store/public . 2>/dev/null || true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Execute all analyzers & report builder
      env:
        WEALTHRATE1: ${{ secrets.WEALTHRATE1 }}
        WEALTHRATE2: ${{ secrets.WEALTHRATE2 }}
        WEALTHRATE3: ${{ secrets.WEALTHRATE3 }}
      run: python main.py --task all

    - name: Commit and push results to data branch
      run: |
        cp -f *.json data_store/
        cp -rf public data_store/
        cd data_store
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "chore: update wealthrate data and report"
          git pull --rebase origin data
          git push origin data
        fi
